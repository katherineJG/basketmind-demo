# Blueprint section 7 defaults.
optimizer: adamw
learning_rate: 0.0003
weight_decay: 0.0001
batch_size: 128
max_epochs: 50
early_stopping_patience: 7
gradient_clip: 1.0
scheduler: reduce_on_plateau
seeds: [42, 43, 44]
precision: fp32   # enable mixed precision only after a successful GPU compatibility test
device: auto      # auto = AMD GPU via ROCm if available, else CPU
# Neural model training (not in the blueprint table; starting values, to be tuned on validation only).
pos_weight: 20.0            # positive-class weight of the basket BCE (the baselines liked 9 to 75)
quantity_samples: 16        # target-basket items per example used for the quantity head
huber_delta: 1.0
selection_metric: recall@10 # validation metric for early stopping, scheduler and best checkpoint
scheduler_patience: 2
scheduler_factor: 0.5
